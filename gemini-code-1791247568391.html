<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollEd Clone - Reading Reinvented</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .snap-container {
            scroll-snap-type: y mandatory;
        }
        .snap-section {
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex items-center justify-between z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl text-lg tracking-wider">SE</div>
            <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">ScrollEd</span>
        </div>
        <div id="nav-progress" class="hidden items-center space-x-4">
            <span id="progress-text" class="text-xs text-slate-400 font-medium">Card 1 of 4</span>
            <div class="w-32 bg-slate-800 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 25%;"></div>
            </div>
            <button onclick="resetApp()" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold border border-indigo-500/30 px-3 py-1.5 rounded-lg transition">📁 Switch Book</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 relative overflow-hidden flex flex-col items-center justify-center">

        <!-- VIEW 1: UPLOAD / DASHBOARD -->
        <div id="view-upload" class="w-full max-w-2xl px-6 py-12 flex flex-col items-center text-center">
            <div class="inline-flex items-center space-x-2 bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 px-4 py-1.5 rounded-full text-xs font-semibold mb-6">
                <span>✨ AI Smart-Scrolling Platform</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight mb-4 leading-tight">
                Reading reinvented for the <span class="bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">scrolling generation</span>.
            </h1>
            <p class="text-slate-400 text-base sm:text-lg mb-8 max-w-lg">
                Transform any book, PDF, notes, or long text into an addictive, bite-sized learning feed.
            </p>

            <!-- Dropzone / Input Box -->
            <div id="drop-zone" class="w-full bg-slate-900 border-2 border-dashed border-slate-700 hover:border-indigo-500 transition rounded-3xl p-8 flex flex-col items-center shadow-2xl cursor-pointer">
                <div class="w-16 h-16 bg-indigo-600/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl mb-4 pointer-events-none">
                    📚
                </div>
                <h3 class="font-semibold text-lg mb-1 pointer-events-none">Drag & Drop your file here</h3>
                <p id="file-instruction" class="text-xs text-slate-400 mb-6 pointer-events-none">Supports TXT, Markdown, or raw notes (or click to browse)</p>
                
                <!-- Hidden native file input -->
                <input type="file" id="file-input" class="hidden" accept=".txt,.md,.json">

                <textarea id="source-text-input" rows="3" placeholder="Or paste chapters, articles, or notes here to test instantly..." class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none rounded-xl p-4 text-sm text-slate-200 resize-none mb-4"></textarea>
                
                <div class="flex flex-wrap gap-3 justify-center w-full">
                    <button onclick="loadDemoContent()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-3 px-6 rounded-xl text-sm transition">
                        Load Demo Book 🚀
                    </button>
                    <button onclick="processCustomText()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition">
                        Generate AI Feed ⚡
                    </button>
                </div>
            </div>
        </div>

        <!-- VIEW 2: SMART-SCROLLING FEED -->
        <div id="view-feed" class="hidden w-full h-full snap-container overflow-y-auto no-scrollbar relative flex flex-col items-center">
            <!-- Dynamic Cards Container injected via JS -->
            <div id="cards-wrapper" class="w-full max-w-xl flex flex-col items-center py-10 px-4 space-y-12 min-h-full justify-center">
            </div>
        </div>

    </main>

    <!-- Client-side Logic -->
    <script>
        const demoCards = [
            {
                type: "idea",
                badge: "Big Idea 01 / 04",
                title: "The Mechanics of Habit Loops",
                content: "Every habit operates through a psychological feedback loop consisting of a cue, a routine, and a reward. Understanding this loop is the foundational key to overriding unwanted behaviors and engineering positive output.",
                evidence: "“Habits, once formed, leave an indelible neurological trace in the structures of the brain.” — W. James",
                takeaway: "Identify the trigger (cue) that sparks your automatic behavior pattern."
            },
            {
                type: "idea",
                badge: "Big Idea 02 / 04",
                title: "The 2-Minute Rule for Action",
                content: "When you start a new habit, it should take less than two minutes to do. The goal is not to instantly master a massive routine, but to master the art of showing up consistently.",
                evidence: "“A new habit should not feel like a challenge. The actions that follow can be challenging, but the first two minutes should be effortless.”",
                takeaway: "Scale down your big goals into micro-habits that take under 120 seconds."
            },
            {
                type: "quiz",
                badge: "Knowledge Check 🧠",
                question: "According to the text, what are the three parts of every psychological habit loop?",
                options: [
                    "Idea, Action, Result",
                    "Cue, Routine, Reward",
                    "Prompt, Focus, Habit",
                    "Trigger, Speed, Dopamine"
                ],
                correct: 1,
                explanation: "Correct! The habit loop consists of a Cue, a Routine, and a Reward."
            },
            {
                type: "idea",
                badge: "Big Idea 04 / 04",
                title: "Environment Design Over Willpower",
                content: "Environment is the invisible hand that shapes human behavior. People often fail because of lack of motivation, when in reality, their physical space is littered with friction for good habits and cues for bad ones.",
                evidence: "“Design your world so that the action of least resistance is the best possible choice.”",
                takeaway: "Make the cues of good habits obvious and visible in your direct environment."
            }
        ];

        let currentCards = [];

        // --- Drag and Drop File Handlers ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');

        dropZone.addEventListener('click', (e) => {
            // Prevent triggering if clicking inside the textarea or buttons
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.closest('textarea')) return;
            fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-indigo-500', 'bg-slate-900/80');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-indigo-500', 'bg-slate-900/80');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-indigo-500', 'bg-slate-900/80');
            
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            document.getElementById('file-instruction').innerText = `Loaded file: ${file.name}`;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById('source-text-input').value = e.target.result;
            };
            
            reader.readAsText(file);
        }

        function loadDemoContent() {
            currentCards = demoCards;
            initFeed();
        }

        function processCustomText() {
            const text = document.getElementById('source-text-input').value.trim();
            if (!text) {
                alert('Please drop a file, enter some text, or click "Load Demo Book"!');
                return;
            }
            
            const chunks = text.split(/\n\n+/);
            currentCards = chunks.map((chunk, index) => ({
                type: "idea",
                badge: `Parsed Concept 0${index + 1}`,
                title: `Generated Insight #${index + 1}`,
                content: chunk,
                evidence: "Extracted directly from your custom upload source file.",
                takeaway: "Apply this core principle to your active workflow."
            }));

            currentCards.push({
                type: "quiz",
                badge: "Comprehension Check 🧠",
                question: "Based on the document you supplied, what is the core theme?",
                options: [
                    "Continuous learning & micro-habits",
                    "Random information noise",
                    "Unstructured data strings",
                    "None of the above"
                ],
                correct: 0,
                explanation: "Great job! You've successfully completed your custom document feed."
            });

            initFeed();
        }

        function initFeed() {
            document.getElementById('view-upload').classList.add('hidden');
            document.getElementById('view-feed').classList.remove('hidden');
            document.getElementById('nav-progress').classList.remove('hidden');
            document.getElementById('nav-progress').classList.add('flex');

            const wrapper = document.getElementById('cards-wrapper');
            wrapper.innerHTML = '';

            currentCards.forEach((card, index) => {
                const section = document.createElement('section');
                section.className = 'snap-section w-full flex items-center justify-center min-h-[75vh] py-4';
                
                if (card.type === 'idea') {
                    section.innerHTML = `
                        <div class="w-full bg-slate-900/90 border border-slate-800 hover:border-indigo-500/50 transition-all rounded-3xl p-6 sm:p-8 shadow-2xl relative flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-6">
                                    <span class="text-xs font-bold uppercase tracking-wider bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-3 py-1 rounded-full">${card.badge}</span>
                                    <span class="text-xs text-slate-500 font-mono">Focus Mode Active</span>
                                </div>
                                <h2 class="text-2xl font-bold mb-4 text-slate-100">${card.title}</h2>
                                <p class="text-slate-300 text-base leading-relaxed mb-6">${card.content}</p>
                                
                                <div class="bg-slate-950/60 border-l-2 border-indigo-500 p-4 rounded-r-xl mb-6 text-xs text-slate-400 italic">
                                    ${card.evidence}
                                </div>
                            </div>
                            
                            <div class="bg-indigo-950/30 border border-indigo-500/20 rounded-2xl p-4 flex items-center space-x-3">
                                <span class="text-lg">💡</span>
                                <div>
                                    <div class="text-[10px] uppercase tracking-wider font-bold text-indigo-400">Key Takeaway</div>
                                    <div class="text-xs text-slate-200 font-medium">${card.takeaway}</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (card.type === 'quiz') {
                    let optionsHtml = '';
                    card.options.forEach((opt, oIdx) => {
                        optionsHtml += `
                            <button onclick="handleQuizAnswer(this, ${oIdx}, ${card.correct})" class="w-full text-left bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 p-4 rounded-xl text-sm transition font-medium flex items-center justify-between group">
                                <span>${opt}</span>
                                <span class="w-5 h-5 rounded-full border border-slate-700 flex items-center justify-center text-xs text-transparent group-hover:border-indigo-400">✓</span>
                            </button>
                        `;
                    });

                    section.innerHTML = `
                        <div class="w-full bg-slate-900/90 border border-violet-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl relative flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-6">
                                    <span class="text-xs font-bold uppercase tracking-wider bg-violet-500/10 text-violet-400 border border-violet-500/20 px-3 py-1 rounded-full">${card.badge}</span>
                                    <span class="text-xs text-violet-400 font-medium">Active Recall</span>
                                </div>
                                <h2 class="text-xl font-bold mb-6 text-slate-100">${card.question}</h2>
                                <div class="space-y-3 mb-4">
                                    ${optionsHtml}
                                </div>
                                <div class="quiz-feedback hidden mt-4 p-3 rounded-xl text-xs font-medium"></div>
                            </div>
                        </div>
                    `;
                }

                wrapper.appendChild(section);
            });

            setupScrollListener();
            updateProgress(0);
        }

        function handleQuizAnswer(btn, selectedIdx, correctIdx) {
            const container = btn.closest('div.space-y-3');
            const buttons = container.querySelectorAll('button');
            const feedback = container.parentElement.querySelector('.quiz-feedback');

            buttons.forEach((b, idx) => {
                b.disabled = true;
                if (idx === correctIdx) {
                    b.classList.remove('bg-slate-950', 'border-slate-800');
                    b.classList.add('bg-emerald-950/40', '
