<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScrollEd</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--ink:#14110f;--paper:#fffaf0;font-family:"Bricolage Grotesque",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--ink)}
button,textarea,input{font:inherit;color:inherit}
#setup{min-height:100%;background:var(--paper);padding:max(24px,env(safe-area-inset-top)) 22px 40px;max-width:640px;margin:auto}
h1{font-size:clamp(44px,12vw,72px);font-weight:800;letter-spacing:-.04em;line-height:.95;margin:24px 0 10px}
p.sub{font-size:18px;line-height:1.4;margin-bottom:26px;max-width:46ch}
label{display:block;font-weight:800;margin:20px 0 6px}
input,textarea{width:100%;border:3px solid var(--ink);background:#fff;padding:12px;border-radius:10px}
textarea{height:150px;resize:vertical}
small{display:block;margin-top:6px;line-height:1.4}
a{color:inherit}
.btn{border:3px solid var(--ink);background:#FFD93D;font-weight:800;padding:14px 22px;border-radius:999px;cursor:pointer;margin-top:22px;font-size:18px}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:4px solid #2B3BE5;outline-offset:2px}
#err{color:#b00020;font-weight:800;margin-top:14px}
#feed{display:none;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory}
.clip{height:100dvh;scroll-snap-align:start;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;overflow:hidden}
.clip h2{font-size:clamp(34px,9vw,56px);line-height:1;letter-spacing:-.03em;font-weight:800}
.hook{font-size:19px;line-height:1.3}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
li{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.3;opacity:0;transform:translateY(14px);transition:.4s}
.clip.on li{opacity:1;transform:none}
.clip.on li:nth-child(2){transition-delay:.9s}.clip.on li:nth-child(3){transition-delay:1.8s}
.src{font-size:13px;opacity:.75;line-height:1.35;margin-top:auto}
.q{background:var(--ink);color:var(--paper);border-radius:16px;padding:14px}
.q b{display:block;font-size:18px;margin-bottom:10px;line-height:1.25}
.opt{display:block;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:10px;padding:10px 12px;margin-top:6px;cursor:pointer}
.opt.right{background:#14C38E}.opt.wrong{background:#ff6b6b}
.why{margin-top:10px;font-size:15px;line-height:1.35}
.bar{display:flex;gap:10px;align-items:center}
.pill{border:3px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer}
#hud{position:fixed;right:12px;top:max(10px,env(safe-area-inset-top));z-index:5;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px}
.load{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;background:var(--paper)}
@media(prefers-reduced-motion:reduce){li{transition:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="setup">
  <h1>ScrollEd</h1>
  <p class="sub">Paste a chapter or upload a PDF. Get a feed of short lessons with a quiz question after each one.</p>
  <label for="key">Gemini API key (free)</label>
  <input id="key" type="password" autocomplete="off" placeholder="Paste your key">
  <small>Get one free at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. It stays in this browser and is only sent to Google.</small>
  <label for="file">Upload a .pdf, .txt or .md file</label>
  <input id="file" type="file" accept=".pdf,.txt,.md">
  <label for="txt">Or paste text</label>
  <textarea id="txt" placeholder="Paste a chapter, notes, or an article"></textarea>
  <button class="btn" id="go">Start scrolling</button>
  <div id="err" role="alert"></div>
</div>
<div id="hud" hidden></div>
<div id="feed"></div>
<script>
const $=id=>document.getElementById(id);
const COLORS=["#2B3BE5","#FF7A1A","#14C38E","#B79CFF","#FFD93D","#FF6FA5"];
const MODEL="gemini-2.5-flash";
let chunks=[],next=0,busy=false,score={right:0,total:0},clipN=0;
try{$("key").value=localStorage.getItem("scrolled_key")||""}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function chunk(text,size=3500){
  const paras=text.replace(/\r/g,"").split(/\n{2,}|(?<=\.)\s{2,}/);const out=[];let cur="";
  for(const p of paras){if((cur+p).length>size&&cur){out.push(cur);cur=""}cur+=p+"\n\n"}
  if(cur.trim().length>200)out.push(cur);return out;
}
async function readPdf(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let t="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);t+=(await pg.getTextContent()).items.map(x=>x.str).join(" ")+"\n\n"}
  return t;
}
async function gen(text){
  const prompt=`You turn study material into short, engaging video-style lessons. From the TEXT below, write 3 lessons, each covering ONE distinct idea. Use only facts from the text. Return a JSON array of 3 objects with keys: title (max 7 words), hook (one punchy sentence), points (array of exactly 3 short sentences), narration (about 40 words, spoken style), source (a short phrase copied from the text), quiz (object: q, options (array of 3 strings), answer (index 0-2), why (one sentence)).\n\nTEXT:\n${text}`;
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,{
    method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":$("key").value.trim()},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json"}})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||"Request failed ("+r.status+")")}
  const d=await r.json();return JSON.parse(d.candidates[0].content.parts[0].text);
}
function render(c){
  const n=clipN++,el=document.createElement("section");el.className="clip";el.style.background=COLORS[n%COLORS.length];
  const dark=["#2B3BE5"].includes(COLORS[n%COLORS.length]);if(dark)el.style.color="#fff";
  const q=c.quiz||{options:[]};
  el.innerHTML=`<h2>${esc(c.title)}</h2><p class="hook">${esc(c.hook)}</p>
  <ul>${(c.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
  <div class="q"><b>${esc(q.q)}</b>${(q.options||[]).map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}<div class="why" hidden></div></div>
  <div class="bar"><button class="pill" data-say>Listen</button><span class="src">From the text: “${esc(c.source)}”</span></div>`;
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(el.dataset.done)return;el.dataset.done=1;const ok=+b.dataset.i===+q.answer;
    b.classList.add(ok?"right":"wrong");
    if(!ok)el.querySelector(`.opt[data-i="${q.answer}"]`)?.classList.add("right");
    score.total++;if(ok)score.right++;hud();
    const w=el.querySelector(".why");w.hidden=false;w.textContent=(ok?"Correct. ":"Not quite. ")+(q.why||"");
  });
  el.querySelector("[data-say]").onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(c.narration))}catch(e){}};
  $("feed").appendChild(el);io.observe(el);
}
const io=new IntersectionObserver(es=>es.forEach(e=>{
  e.target.classList.toggle("on",e.isIntersecting);
  if(e.isIntersecting){try{speechSynthesis.cancel()}catch(x){}
    if(e.target===$("feed").lastElementChild.previousElementSibling||e.target===$("feed").lastElementChild)more()}
}),{threshold:.6});
function hud(){$("hud").hidden=false;$("hud").textContent=`${score.right}/${score.total} correct`}
async function more(){
  if(busy||next>=chunks.length)return;busy=true;
  const ph=document.createElement("section");ph.className="clip load";ph.textContent="Making your next lessons…";$("feed").appendChild(ph);
  try{const cs=await gen(chunks[next++]);ph.remove();cs.forEach(render)}
  catch(e){ph.textContent="Couldn't generate: "+e.message;next--;setTimeout(()=>{ph.remove();busy=false;more()},6000);return}
  busy=false;
}
$("go").onclick=async()=>{
  $("err").textContent="";const key=$("key").value.trim();
  if(!key)return $("err").textContent="Add your Gemini API key first.";
  try{localStorage.setItem("scrolled_key",key)}catch(e){}
  let text=$("txt").value;const f=$("file").files[0];
  try{if(f)text=/\.pdf$/i.test(f.name)?await readPdf(f):await f.text()}catch(e){return $("err").textContent="Couldn't read that file."}
  chunks=chunk(text);if(!chunks.length)return $("err").textContent="Add at least a few paragraphs of text.";
  $("setup").style.display="none";$("feed").style.display="block";more();
};
</script>
</body>
</html>
